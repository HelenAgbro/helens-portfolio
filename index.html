<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Helen — a product designer crafting clear, thoughtful digital experiences."
    />
    <link rel="preload" href="/fonts/AgrandirRegular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <title>Helen — Product Designer</title>
    <script>
      /* Apply the saved theme before the first paint so there is no flash
         of the wrong palette. Mirrors readInitialTheme() in src/App.jsx. */
      (function () {
        var theme = "paper";
        try {
          var saved = localStorage.getItem("helen-portfolio-theme");
          if (saved === "paper" || saved === "dusk") {
            theme = saved;
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dusk";
          }
        } catch (error) {
          /* localStorage blocked — keep the default */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
